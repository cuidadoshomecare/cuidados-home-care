<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><title>Formulário de contato</title></head>
  <body>
    <form name="contato-site" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contato-site">
      <input type="text" name="bot-field">
      <input type="text" name="nome">
      <input type="tel" name="telefone">
      <input type="email" name="email">
      <input type="text" name="regiao">
      <select name="necessidade"><option>Acompanhamento de pessoa idosa</option></select>
      <textarea name="mensagem"></textarea>
    </form>
  </body>
</html>
